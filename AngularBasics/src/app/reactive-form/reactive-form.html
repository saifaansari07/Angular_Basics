
<div class="container mt-5 myform" [ngClass]="formStatus">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white text-center">
                    <h4>Registration Form</h4>
                </div>
                <div class="card-body">
                    <form [formGroup]="reactiveFrom" (ngSubmit)="onSubmit()">
                        
                        <div formGroupName="personalDetails">
                        <!-- First Name -->
                        <div class="mb-3">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstName" placeholder="Enter first name" 
                            name="firstName" formControlName="firstname">
                        </div>

                        <div>
                            <span *ngIf="reactiveFrom.get('personalDetails.firstname')?.errors?.['required']">First Name is required</span>
                            <span *ngIf="reactiveFrom.get('personalDetails.firstname')?.errors?.['noSpaceAllowed']">First Name cannot contain a space</span>
                        </div>

                        <!-- Last Name -->
                        <div class="mb-3">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lastName" placeholder="Enter last name" 
                            name="lastName" formControlName="lastname">
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter email" 
                            name="email" formControlName="email"> 
                        </div>

                        <div>
                            <span style="color: red;" *ngIf="!reactiveFrom.get('personalDetails.email')?.valid && reactiveFrom.touched">
                                The email is incorrect.</span>
                        </div>
                    </div>

                        <!-- Country Dropdown -->
                        <div class="mb-3">
                            <label for="country" class="form-label">Country</label>
                            <select class="form-select" id="country" name="country" formControlNam="country">
                                <option value="">Select your country</option>
                                <option value="US">United States</option>
                                <option value="CA">Canada</option>
                                <option value="UK">United Kingdom</option>
                                <option value="IN">India</option>
                                <option value="AU">Australia</option>
                                <option value="DE">Germany</option>
                                <option value="FR">France</option>
                                <option value="JP">Japan</option>
                                <option value="CN">China</option>
                                <option value="BR">Brazil</option>
                            </select>
                        </div>

                        <!-- Gender Radio -->
                        <label class="form-label d-block">Gender</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" id="male" value="Male" name="gender" formControlName="gender">
                            <label class="form-check-label">Male</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" id="female" value="Female" name="gender" formControlName="gender">
                            <label class="form-check-label">Female</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" id="other" value="Other" name="gender" formControlName="gender">
                            <label class="form-check-label">Other</label>
                        </div>

                        <!-- Hobbies Checkbox -->
                        <label class="form-label d-block mt-3">Hobbies(Optional)</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="sports" value="Sports" name="hobbies" formControlName="hobbies">
                            <label class="form-check-label" for="sports">Sports</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="movies" value="Movies" name="hobbies" formControlName="hobbies">
                            <label class="form-check-label" for="movies">Movies</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="music" value="Music" name="hobbies" formControlName="hobbies">
                            <label class="form-check-label" for="music">Music</label>
                        </div>

                        <div class="mb-3" formArrayName="skills">
                            <ng-container *ngFor="let s of skills.controls;index as i">
                            <label for="skill" class="form-label">Skill</label>
                            <input type="text" class="form-control" id="skill" placeholder="Enter Skill" formControlName="{{i}}"> 
                        </ng-container>
                        <button class="btn btn-primary" (click)="addSkills()">Add Skills</button>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary" value="submit">Register</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
